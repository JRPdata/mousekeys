# Mousekeys Configuration File
# Default settings are aggressive/responsive

# --- Mouse Movement Speeds ---
# Normal speed when no modifiers are pressed
vmax_normal=40

# Fast speed when Ctrl is held
vmax_fast=30

# Slow speed when Shift is held
vmax_slow=2

# --- Movement Physics ---
# Smoothing factor for acceleration (0.0-1.0)
# Lower values = more gradual acceleration
# Higher values = more responsive movement
tau=0.01

# Maximum velocity to prevent runaway mouse movement
# Useful if tau is set too high or for safety
max_velocity=100.0

# --- Click Timing ---
# Delay between double-clicks in milliseconds
double_click_delay=25

# --- Mousekeys Activation ---
# Whether mousekeys should be enabled when NumLock is ON (true) or OFF (false)
mousekeys_numlock_on=true

# --- Performance Tuning ---
# How often to update mouse movement in milliseconds
# Lower values = smoother movement but more CPU usage
# Higher values = choppier movement but less CPU usage
movement_update_rate=10

# --- Device Reconnection ---
# How long to wait before attempting reconnection after device failure (seconds)
# Useful if you frequently plug/unplug keyboards
reconnect_delay=2

# Scan for new keyboards
# How often to check if a new keyboard has been plugged in
# Automatically check by priority (external keyboards) whether to switch the daemon to use mousekeys with it
# Disable future scanning by setting to 0
keyboard_scan_interval=10